<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f5c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Journal">
  <title>Dashboard · Trading Journal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <p class="sub" id="todayLabel"></p>
      <a class="link" href="settings.html" style="font-size:.9rem">Settings</a>
    </div>
    <h1 id="greeting">Hello</h1>

    <h2>Today's analysis</h2>
    <div id="todayList"></div>

    <h2>How are you today? <small>wellbeing check-in</small></h2>
    <div class="card">
      <div id="checkinFields"></div>
      <textarea id="checkinNote" placeholder="Anything affecting your focus today? (optional)"></textarea>
      <div style="height:10px"></div>
      <button class="btn secondary" id="saveCheckin" type="button">Save check-in</button>
    </div>

    <h2>Trading summary <small><a class="link" href="progress.html">See progress</a></small></h2>
    <div class="tiles" id="summary"></div>
    <div class="insight" id="insight" hidden></div>

    <div class="insight" id="backupNote" hidden></div>

    <h2>Recent activity <small>tap a card to add more</small></h2>
    <div id="recentList"></div>
  </main>

  <nav id="nav"></nav>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
