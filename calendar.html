<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f5c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Journal">
  <title>Calendar · Trading Journal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <div class="calhead">
      <button type="button" id="prev" aria-label="Previous month">‹</button>
      <div class="calmid">
        <h1 id="monthTitle" style="margin:0"></h1>
        <p class="sub" id="monthSummary"></p>
      </div>
      <button type="button" id="next" aria-label="Next month">›</button>
    </div>

    <div class="card calcard">
      <div class="cal dow" id="dow"></div>
      <div class="cal" id="grid"></div>
    </div>
    <div class="legend">
      <span><i class="dot a"></i>Analysis</span>
      <span><i class="dot t"></i>Trade</span>
      <span><i class="dot c"></i>Check-in</span>
      <button type="button" id="todayBtn" class="link" style="margin-left:auto;background:none;border:0;font:inherit;cursor:pointer">Today</button>
    </div>

    <h2 id="dayTitle"></h2>
    <div id="dayCheckin"></div>

    <div class="subhead" style="margin-top:16px">Analysis</div>
    <div id="dayAnalyses"></div>
    <div class="subhead">Trades</div>
    <div id="dayTrades"></div>

    <div class="seg two" style="margin-top:16px">
      <a class="btn secondary" id="addAnalysis" href="create.html">+ Analysis</a>
      <a class="btn secondary" id="addTrade" href="create.html">+ Trade</a>
    </div>
  </main>

  <nav id="nav"></nav>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/calendar.js"></script>
</body>
</html>
